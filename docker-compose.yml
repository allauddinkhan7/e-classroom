services:
  postgres:
    image: postgres:16 # Docker downloads the official PostgreSQL 16 image and uses it to create the containex`x`r So you don't need to manually install PostgreSQL 16.
    container_name: eclassroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eclassroom
      POSTGRES_PASSWORD: eclassroom_dev_password
      POSTGRES_DB: eclassroom
      # data persist so stopping/restarting the container doesn't wipe your database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432" # Expose PostgreSQL on port 5434 of the host machine
  redis:
    image: redis:7
    container_name: eclassroom-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6399:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - 6c0a6c1db3450900081ca26c24080825a51cc59ce3fdfb35  
  minio:
    image: minio/minio:latest
    container_name: eclassroom-minio
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9001:9001" # Web console — you'll browse files here in a browser
    environment:
      MINIO_ROOT_USER: eclassroom
      MINIO_ROOT_PASSWORD: eclassroom_dev_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  livekit:
    image: livekit/livekit-server:latest
    container_name: eclassroom-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "eclassroom-key: 8dhCFATzqF3NwghA+WVoTXXu6PA0yNDTmzlR5gj2aEY="
      LIVEKIT_RTC_PORT_RANGE_START: "51000"
      LIVEKIT_RTC_PORT_RANGE_END: "51100"
    command: --dev
    # command: --config /etc/livekit.yaml
    network_mode: "host"
    # volumes:
    #   - ./livekit.yaml:/etc/livekit.yaml
    # command: --config /etc/livekit.yaml

  # backend:

services:
  postgres:
    image: postgres:16 # Docker downloads the official PostgreSQL 16 image and uses it to create the containex`x`r So you don't need to manually install PostgreSQL 16.
    container_name: eclassroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eclassroom
      POSTGRES_PASSWORD: eclassroom_dev_password
      POSTGRES_DB: eclassroom
      # data persist so stopping/restarting the container doesn't wipe your database
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: eclassroom-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
  minio:
    image: minio/minio:latest
    container_name: eclassroom-minio
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9001:9001" # Web console — you'll browse files here in a browser
    environment:
      MINIO_ROOT_USER: eclassroom
      MINIO_ROOT_PASSWORD: eclassroom_dev_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  livekit:
    image: livekit/livekit-server:latest
    container_name: eclassroom-livekit
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    network_mode: "host"
    # volumes:
    #   - ./livekit.yaml:/etc/livekit.yaml
    # command: --config /etc/livekit.yaml

  backend:
    build:
      context: ./backend
    container_name: eclassroom-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
    container_name: eclassroom-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
  
  

volumes:
  postgres_data:
  redis_data:
  minio_data:

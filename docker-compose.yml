  #     context: ./backend
  #   container_name: eclassroom-backend
  #   restart: unless-stopped
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   env_file:
  #     - .env
  #   ports:
  #     - "8000:8000"

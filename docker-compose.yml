services:
  postgres:
    image: postgres:16 # Docker downloads the official PostgreSQL 16 image and uses it to create the container So you don't need to manually install PostgreSQL 16.
    container_name: eclassroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eclassroom
      POSTGRES_PASSWORD: eclassroom_dev_password
      POSTGRES_DB: eclassroom
      # ports: maps the container's port 5432 to your machine's port 5432 so tools outside Docker (like Prisma) can reach it
    ports:
      - "5432:5432"
      # data persist so stopping/restarting the container doesn't wipe your database
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: eclassroom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  minio:
    image: minio/minio:latest
    container_name: eclassroom-minio
    restart: unless-stopped
    ports:
      - "9000:9000" # API port — this is what your backend talks to
      - "9001:9001" # Web console — you'll browse files here in a browser
    environment:
      MINIO_ROOT_USER: eclassroom
      MINIO_ROOT_PASSWORD: eclassroom_dev_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    
  livekit:
    image: livekit/livekit-server:latest
    container_name: eclassroom-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"   # HTTP/WebSocket — this is what your frontend connects to
      - "7881:7881"   # TCP fallback for restrictive networks
      - "51000-51100:51000-51100/udp"  # media (audio/video) traffic
    environment:
      LIVEKIT_KEYS: "eclassroom-key: 8dhCFATzqF3NwghA+WVoTXXu6PA0yNDTmzlR5gj2aEY="
      LIVEKIT_RTC_PORT_RANGE_START: "51000"
      LIVEKIT_RTC_PORT_RANGE_END: "51100"
    command: --dev

volumes:
  postgres_data:
  redis_data:
  minio_data:
